name: CI - Java App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-scan:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v3

      - name: Configure JFrog CLI
        run: |
          jf config add artifactory \
            --url=${{ vars.JF_URL }} \
            --user=${{ secrets.JF_USER }} \
            --password=${{ secrets.JF_PASSWORD }} \
            --interactive=false

      - name: Upload JAR to Artifactory
        run: |
          jf rt upload \
            --server-id=artifactory \
            "target/poc-java-app-1.0-SNAPSHOT.jar" \
            "poc-java-app-repo/com/example/poc-java-app/1.0-SNAPSHOT/"

      - name: Build Docker image
        run: |
          docker build -t 172.16.4.206:8443/poc-docker-local/poc-java-app:${{ github.sha }} .

      - name: Push Docker image via JFrog CLI
        run: |
          jf docker push \
            172.16.4.206:8443/poc-docker-local/poc-java-app:${{ github.sha }} \
            --server-id=artifactory

      - name: Scan with Xray
        run: |
          jf docker scan \
            172.16.4.206:8443/poc-docker-local/poc-java-app:${{ github.sha }} \
            --server-id=artifactory
