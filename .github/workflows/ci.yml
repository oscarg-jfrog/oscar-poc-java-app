name: CI - Java App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write   # required to request the OIDC JWT from GitHub
  contents: read

jobs:
  build-and-scan:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Set up JFrog CLI with OIDC
        uses: jfrog/setup-jfrog-cli@v3
        env:
          JF_URL: ${{ vars.JF_URL }}
        with:
          oidc-provider-name: <YOUR_PROVIDER_NAME>

      - name: Upload JAR to Artifactory
        run: |
          jf rt upload \
            --server-id=setup-jfrog-cli-server \
            "target/poc-java-app-1.0-SNAPSHOT.jar" \
            "poc-java-app-repo/com/example/poc-java-app/1.0-SNAPSHOT/"

      - name: Build Docker image with Podman
        run: |
          podman build -t ${{ vars.JF_DOCKER_REGISTRY }}/poc-docker-local/poc-java-app:${{ github.sha }} .

      - name: Push Docker image via JFrog CLI
        run: |
          jf rt podman-push \
            ${{ vars.JF_DOCKER_REGISTRY }}/poc-docker-local/poc-java-app:${{ github.sha }} \
            poc-docker-local \
            --server-id=setup-jfrog-cli-server \
            --skip-login
