name: CI - Java App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-scan:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v3
        env:
          JF_URL: ${{ secrets.JF_URL }}
          JF_USER: ${{ secrets.JF_USER }}
          JF_PASSWORD: ${{ secrets.JF_PASSWORD }}

      - name: Upload JAR to Artifactory
        run: |
          jf rt upload \
            "target/poc-java-app-1.0-SNAPSHOT.jar" \
            "poc-java-app-repo/com/example/poc-java-app/1.0-SNAPSHOT/"

      - name: Build Docker image
        run: |
          docker build -t poc-java-app:${{ github.sha }} .

      - name: Push Docker image to Artifactory
        run: |
          docker tag poc-java-app:${{ github.sha }} \
            ${{ secrets.JF_DOCKER_REGISTRY }}/poc-java-app:${{ github.sha }}
          docker login \
            -u ${{ secrets.JF_USER }} \
            -p ${{ secrets.JF_PASSWORD }} \
            ${{ secrets.JF_DOCKER_REGISTRY }}
          docker push ${{ secrets.JF_DOCKER_REGISTRY }}/poc-java-app:${{ github.sha }}

      - name: Scan with Xray
        run: |
          jf docker scan ${{ secrets.JF_DOCKER_REGISTRY }}/poc-java-app:${{ github.sha }}
